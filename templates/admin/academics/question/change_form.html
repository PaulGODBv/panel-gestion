{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block content %}
<div class="rt-form-layout">
    <!-- Formulario -->
    <div class="rt-form-layout__main">
        {{ block.super }}
    </div>

    <!-- Vista previa: cómo se verá la pregunta en la app -->
    <aside class="rt-form-layout__aside" aria-label="Vista previa en la aplicación móvil">
        <p class="rt-eyebrow">VISTA PREVIA EN LA APP</p>

        <div class="rt-phone">
            <div class="rt-phone__notch" aria-hidden="true"></div>

            <div class="rt-phone__screen">
                <div class="rt-phone__level" id="mockup-level">Nivel</div>

                <div class="rt-phone__question" id="mockup-text">
                    Aquí aparecerá el enunciado de la pregunta...
                </div>

                <div class="rt-phone__reading" id="mockup-reading" style="display: none;"></div>

                <div class="rt-phone__options" id="mockup-options">
                    <div class="rt-phone__option">Opción 1</div>
                    <div class="rt-phone__option">Opción 2</div>
                    <div class="rt-phone__option">Opción 3</div>
                    <div class="rt-phone__option">Opción 4</div>
                </div>
            </div>
        </div>
    </aside>
</div>

<!-- Toasts flotantes (Toastify) -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
{% endblock %}
